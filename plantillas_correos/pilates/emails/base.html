<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Apple-inspired Reset */
        body, table, td, div, p, a, h1, h2, h3, h4, h5, h6 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #FFFFFF !important; /* Solid white background as requested */
            color: #1D1D1F;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 24px 0;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
        }
        
        .wrapper {
            width: 100%;
            background-color: #FFFFFF !important;
            padding: 16px 0;
        }
        
        /* Card Container - Clean and White */
        .container {
            max-width: 540px;
            margin: 0 auto;
            background-color: #FFFFFF;
            /* No borders or shadows for a perfectly flat, clean white look */
        }

        /* Default Header: Good size logo */
        .header {
            padding: 32px 32px 24px 32px;
            text-align: left;
        }
        .header img {
            height: 40px; /* Increased size */
            width: auto;
            display: block;
        }

        /* Content */
        .content {
            padding: 0 32px 40px 32px;
        }
        .content h1 {
            color: #1D1D1F;
            font-size: 28px; /* Larger */
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 24px;
            letter-spacing: -0.02em; /* Optical sizing */
            line-height: 1.2;
        }
        .content p {
            color: #515154;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Gray box for info (like cancellation details) */
        .info-box {
            background-color: #F5F5F7;
            border-radius: 16px;
            padding: 24px;
            margin: 28px 0;
        }
        .info-box p {
            margin-bottom: 12px;
            color: #1D1D1F;
        }
        .info-box p:last-child {
            margin-bottom: 0;
        }

        /* Call to Action Button */
        .button-wrapper {
            margin: 40px 0;
            text-align: left;
        }
        .button {
            display: inline-block;
            background-color: #34236F; /* Brand color */
            color: #FFFFFF !important;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-align: center;
        }

        /* Footer */
        .footer {
            padding: 40px 32px;
            text-align: left;
            border-top: 1px solid rgba(0,0,0,0.06);
            background-color: #FFFFFF !important;
        }
        .footer p {
            color: #86868B;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .footer a {
            color: #34236F;
            text-decoration: none;
            font-weight: 500;
        }

        /* MOBILE FIRST ADAPTATIONS */
        @media only screen and (max-width: 600px) {
            body {
                padding: 0 !important;
            }
            .wrapper {
                padding: 0 !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
            }
            .header {
                padding: 24px 20px 16px 20px !important;
            }
            .header img {
                height: 32px !important; /* Still larger than original */
            }
            .content {
                padding: 0 20px 40px 20px !important;
            }
            .content h1 {
                font-size: 26px !important;
                margin-bottom: 20px !important;
            }
            .content p {
                font-size: 16px !important;
                margin-bottom: 20px !important;
            }
            .info-box {
                padding: 20px !important;
                border-radius: 14px !important;
            }
            .button-wrapper {
                margin: 32px 0 !important;
            }
            .button {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                padding: 18px 24px !important;
                font-size: 16px !important;
                text-align: center !important;
            }
            .footer {
                padding: 32px 20px !important;
            }
        }
    </style>
</head>
<body style="background-color: #FFFFFF;">
    <div class="wrapper" style="background-color: #FFFFFF;">
        <table class="container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin: 0 auto; background-color: #FFFFFF; max-width: 540px;">
            <!-- Header Block for Extensibility -->
            <tr>
                <td class="header">
                    {% block header %}
                    <a href="{{ frontend_url|default:'https://violett.com.ar' }}">
                        <!-- FIXED: Removed /app/ to avoid 404 image -->
                        <img src="https://violett.com.ar/pilates/logo-full.png" alt="Violett" style="display: block;" />
                    </a>
                    {% endblock %}
                </td>
            </tr>
            
            <!-- Body -->
            <tr>
                <td class="content">
                    {% block content %}{% endblock %}
                </td>
            </tr>
            
            <!-- Footer -->
            <tr>
                <td class="footer" style="background-color: #FFFFFF; border-top: 1px solid rgba(0,0,0,0.06);">
                    <p style="color: #86868B; font-size: 13px; line-height: 1.5; margin-bottom: 12px;">
                        Recibiste este correo porque est&aacute;s registrado en Violett.<br>
                        Si no solicitaste esto, pod&eacute;s ignorar el mensaje de forma segura.
                    </p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
