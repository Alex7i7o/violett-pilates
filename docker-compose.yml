services:
  # === APP 1: VIOLETT PILATES ===
  backend_pilates:
    image: violettpilates-backend-pilates
    build:
      context: ./engine
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DATABASE_URL=postgres://violett_user:violett_password@db_pilates:5432/violett_pilates
    volumes:
      - ./config_pilates/client-config.json:/app/config/client-config.json
      - ./media:/app/media
    depends_on:
      - db_pilates
    restart: always

  frontend_pilates:
    image: violettpilates-frontend-pilates
    build:
      context: ./engine
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_URL: /pilates/app/
        VITE_CLIENT_ID: pilates
    volumes:
      - ./config_pilates/client-config.json:/usr/share/nginx/html/client-config.json
    links:
      - backend_pilates:backend
    restart: always

  db_pilates:
    image: postgres:15
    environment:
      POSTGRES_DB: violett_pilates
      POSTGRES_USER: violett_user
      POSTGRES_PASSWORD: violett_password
    volumes:
      - pgdata_pilates:/var/lib/postgresql/data
    restart: always

  # === APP 2: VIOLETT ESTETICA ===
  backend_estetica:
    image: violettpilates-backend-estetica
    build:
      context: ./engine
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DATABASE_URL=postgres://violett_user:violett_password@db_estetica:5432/violett_estetica
    volumes:
      - ./config_estetica/client-config.json:/app/config/client-config.json
      - ./media:/app/media
    depends_on:
      - db_estetica
    restart: always

  frontend_estetica:
    image: violettpilates-frontend-estetica
    build:
      context: ./engine
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_URL: /estetica/app/
        VITE_CLIENT_ID: estetica
    volumes:
      - ./config_estetica/client-config.json:/usr/share/nginx/html/client-config.json
    links:
      - backend_estetica:backend
    restart: always

  db_estetica:
    image: postgres:15
    environment:
      POSTGRES_DB: violett_estetica
      POSTGRES_USER: violett_user
      POSTGRES_PASSWORD: violett_password
    volumes:
      - pgdata_estetica:/var/lib/postgresql/data
    restart: always

  # === PROXY (Maneja el dominio y divide el trafico) ===
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landings/dist:/usr/share/nginx/html/landings:ro
      - ./media:/usr/share/nginx/html/media:ro
    depends_on:
      - frontend_pilates
      - backend_pilates
      - frontend_estetica
      - backend_estetica
    restart: always

volumes:
  pgdata_pilates:
  pgdata_estetica:


