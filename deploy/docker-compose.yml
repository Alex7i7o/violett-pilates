version: '3.8'

services:
  # Enrutador principal que sirve los estáticos y redirige las APIs
  nginx-router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../landings/dist:/var/www/landings:ro
      # Montaremos el front del motor cuando compilemos:
      - ../engine-booking-core/frontend/dist:/var/www/pilates_app:ro
      # - ../engine-booking-core/frontend/dist_estetica:/var/www/estetica_app:ro
    depends_on:
      - pilates-backend
      # - estetica-backend

  # Contenedor del Motor (Django) configurado para PILATES
  pilates-backend:
    build: 
      context: ../engine-booking-core
      dockerfile: Dockerfile.backend
    env_file:
      - ../engine-booking-core/.env.pilates # Archivo .env específico para Pilates
    volumes:
      - pilates-db-data:/app/db_data

  # Contenedor del Motor (Django) configurado para ESTÉTICA (Comentado hasta que lo activemos)
  # estetica-backend:
  #   build: 
  #     context: ../engine-booking-core
  #     dockerfile: Dockerfile.backend
  #   env_file:
  #     - ../engine-booking-core/.env.estetica
  #   volumes:
  #     - estetica-db-data:/app/db_data

volumes:
  pilates-db-data:
  estetica-db-data:
