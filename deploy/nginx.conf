server {
    listen 80;
    server_name localhost; # violett.com.ar en prod

    # 1. Redirección temporal: Raíz -> /estetica
    location = / {
        return 302 /estetica;
    }

    # 2. Vidriera / Landings (Vite Static Files)
    location / {
        root /var/www/landings;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # MOTOR DE RESERVAS: PILATES
    # ==========================================

    # Frontend PWA de Pilates (Vite compilado con base="/pilates/app/")
    location /pilates/app/ {
        alias /var/www/pilates_app/;
        try_files $uri $uri/ /pilates/app/index.html;
    }

    # Backend API de Pilates (Django)
    location /api/pilates/ {
        rewrite ^/api/pilates/(.*) /$1 break;
        proxy_pass http://pilates-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # MOTOR DE RESERVAS: ESTÉTICA
    # ==========================================

    # Frontend PWA de Estética (Vite compilado con base="/estetica/app/")
    location /estetica/app/ {
        alias /var/www/estetica_app/;
        try_files $uri $uri/ /estetica/app/index.html;
    }

    # Backend API de Estética (Django)
    location /api/estetica/ {
        rewrite ^/api/estetica/(.*) /$1 break;
        proxy_pass http://estetica-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
