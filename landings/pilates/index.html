<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violett Pilates</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: #f8fafc; color: #0f172a; }
        header { padding: 1.5rem 2rem; background: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); }
        .logo { font-size: 1.5rem; font-weight: bold; color: #2A1C5A; text-decoration: none; }
        .btn { padding: 0.75rem 1.5rem; background: #2A1C5A; color: white; border-radius: 0.5rem; text-decoration: none; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #1e1342; }
        .hero { text-align: center; padding: 6rem 2rem; }
        .hero h1 { font-size: 3rem; color: #2A1C5A; margin-bottom: 1rem; }
        .hero p { font-size: 1.25rem; color: #64748b; max-width: 600px; margin: 0 auto 2rem auto; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Violett Pilates</a>
        <a href="/pilates/app/" class="btn">Ingresar al Portal</a>
    </header>
    <div class="hero">
        <h1>Tu bienestar en movimiento</h1>
        <p>Reserva tus clases, gestiona tus planes y accede a tu panel personal de Pilates de manera rápida y sencilla.</p>
        <a href="/pilates/app/" class="btn">Acceder al Sistema</a>
    </div>
</body>
</html>
