<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violett | Ecosistema de Salud y Belleza</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8fafc; color: #0f172a; }
        h1 { color: #2A1C5A; margin-bottom: 2rem; }
        .grid { display: flex; gap: 2rem; }
        .card { padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-decoration: none; color: inherit; text-align: center; border: 2px solid transparent; transition: all 0.2s; min-width: 200px; }
        .card:hover { border-color: #2A1C5A; transform: translateY(-5px); }
        .card h2 { margin: 0 0 1rem 0; color: #2A1C5A; }
    </style>
</head>
<body>
    <h1>Bienvenido a Violett</h1>
    <div class="grid">
        <a href="/pilates/" class="card">
            <h2>Violett Pilates</h2>
            <p>Ingresa a nuestro estudio</p>
        </a>
        <a href="/estetica/" class="card" style="opacity: 0.6;">
            <h2>Violett Estética</h2>
            <p>Próximamente</p>
        </a>
    </div>
</body>
</html>
