version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-violett_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-violett_password}
      POSTGRES_DB: ${POSTGRES_DB:-violett_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-violett_user} -d ${POSTGRES_DB:-violett_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 backend_core.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-violett_user}:${POSTGRES_PASSWORD:-violett_password}@db:5432/${POSTGRES_DB:-violett_db}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-default-change-in-prod}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/html/static

volumes:
  postgres_data:
  static_volume:
