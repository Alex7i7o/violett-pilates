<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS reset & base styles */
        body, table, td, div, p, a {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #F8F9FA;
            color: #1A1A1A;
            line-height: 1.6;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
        }
        
        /* Container */
        .wrapper {
            width: 100%;
            background-color: #F8F9FA;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }

        /* Header */
        .header {
            background-color: #34236F;
            padding: 32px 40px;
            text-align: center;
        }
        .header img {
            width: 140px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Content */
        .content {
            padding: 40px;
        }
        .content h1 {
            color: #34236F;
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .content p {
            color: #4A4A4A;
            font-size: 16px;
            margin-bottom: 24px;
        }

        /* Button */
        .button-wrapper {
            text-align: center;
            margin: 32px 0;
        }
        .button {
            display: inline-block;
            background-color: #34236F;
            color: #FFFFFF !important;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            background-color: #F8F9FA;
            padding: 32px 40px;
            text-align: center;
            border-top: 1px solid #EAEAEA;
        }
        .footer p {
            color: #888888;
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
        }
        .footer a {
            color: #34236F;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <table class="container" width="100%" cellpadding="0" cellspacing="0" role="presentation">
            <!-- Header -->
            <tr>
                <td class="header">
                    <!-- Replace with real logo URL later, using a placeholder text for now or hostinger hosted image -->
                    <h2 style="color: white; margin: 0; font-size: 28px; letter-spacing: 1px;">Violett</h2>
                </td>
            </tr>
            
            <!-- Body -->
            <tr>
                <td class="content">
                    {% block content %}{% endblock %}
                </td>
            </tr>
            
            <!-- Footer -->
            <tr>
                <td class="footer">
                    <p>
                        Recibiste este correo porque estás registrado en <strong>Violett</strong>.<br>
                        Si no solicitaste esto, podés ignorar el mensaje de forma segura.
                    </p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
