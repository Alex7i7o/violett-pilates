<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-pilates.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-pilates-dark.png" media="(prefers-color-scheme: dark)" />
    
    <link rel="manifest" href="/manifest.json" />

    <script>
      (function() {
        var isEstetica = window.location.pathname.includes('/estetica');
        
        // Dynamically load the correct manifest so we can have 2 PWAs on the same phone
        var manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          // Keep the base path injected by Vite, just replace the filename
          var currentHref = manifestLink.getAttribute('href') || '';
          var basePath = currentHref.substring(0, currentHref.lastIndexOf('/') + 1);
          manifestLink.setAttribute('href', basePath + (isEstetica ? 'manifest_estetica.json' : 'manifest_pilates.json'));
        }

        // Update Apple PWA meta tags
        var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (titleMeta && isEstetica) {
          titleMeta.setAttribute('content', 'V Estética');
        }
      })();
    </script>

    <meta name="theme-color" content="#34236F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Violett" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <!-- Prevent scaling on input focus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />

    <!-- SEO & Link Preview Meta Tags -->
    <meta name="description" content="Violett Pilates. Tu compromiso con la elegancia. El m&eacute;todo definitivo para esculpir tu figura y conectar cuerpo y mente." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://violett.com.ar/pilates/" />
    <meta property="og:title" content="Violett Pilates" />
    <meta property="og:description" content="Tu compromiso con la elegancia. El m&eacute;todo definitivo para esculpir tu figura." />
    <meta property="og:image" content="https://violett.com.ar/pilates/logo-full.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://violett.com.ar/pilates/" />
    <meta name="twitter:title" content="Violett Pilates" />
    <meta name="twitter:description" content="Tu compromiso con la elegancia. El m&eacute;todo definitivo para esculpir tu figura." />
    <meta name="twitter:image" content="https://violett.com.ar/pilates/logo-full.png" />

    <title>Violett Pilates</title>
  
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; background:#fee; padding:20px; font-family:sans-serif; position:fixed; top:0; left:0; right:0; z-index:9999; overflow-wrap: break-word;">' + e.message + '<br><small>' + e.filename + ':' + e.lineno + '</small></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; background:#fee; padding:20px; font-family:sans-serif; position:fixed; top:0; left:0; right:0; z-index:9999; overflow-wrap: break-word;">Unhandled Promise: ' + (e.reason && e.reason.message || e.reason) + '</div>';
      });
    </script>
</head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var isEstetica = window.location.pathname.includes('/estetica');
          var swPath = isEstetica ? '/estetica/sw.js' : '/pilates/sw.js';
          
          // Fallback if we are in local dev
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            swPath = '/sw.js';
          }
          
          navigator.serviceWorker.register(swPath).catch(err => console.log('SW config error', err));
        });
      }
    </script>

  </body>
</html>
