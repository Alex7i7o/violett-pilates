worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream django_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name violett.com.ar www.violett.com.ar localhost;

        # 1. Main Landing Page
        location = / {
            root /usr/share/nginx/html/landings;
            index index.html;
        }

        # 2. Pilates Landing Page
        location /pilates/ {
            alias /usr/share/nginx/html/landings/pilates/;
            index index.html;
            try_files $uri $uri/ /pilates/index.html;
        }

        # 3. Pilates React App (Vite built static files)
        location /pilates/app/ {
            alias /usr/share/nginx/html/pilates-frontend/;
            index index.html;
            try_files $uri $uri/ /pilates/app/index.html;
        }

        # 4. Django API Backend
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Django Admin (Optional, usually behind /admin/)
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 6. Django Static Files
        location /static/ {
            alias /usr/share/nginx/html/django_static/;
        }
    }
}
