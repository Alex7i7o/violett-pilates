server {
        listen 80;
        server_name violett.com.ar www.violett.com.ar localhost;

        # Redirect HTTP to HTTPS if coming through Cloudflare
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # --- LANDINGS ---
        location / {
            root /usr/share/nginx/html/landings;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            root /usr/share/nginx/html/landings;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /index.html =404;
        }

        # --- PILATES ---
        
        location /media/ {
            alias /usr/share/nginx/html/media/;
        }
        location /pilates/app/ {
            proxy_pass http://frontend_pilates/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /pilates/api/ {
            proxy_pass http://backend_pilates:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ESTETICA ---
        location /estetica/app/ {
            proxy_pass http://frontend_estetica/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /estetica/api/ {
            proxy_pass http://backend_estetica:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }