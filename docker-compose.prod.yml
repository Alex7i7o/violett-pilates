version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: violett_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-violett_db}
      POSTGRES_USER: ${POSTGRES_USER:-violett_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-violett_password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: violett_backend_prod
    command: gunicorn fireseed_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - django_static_volume:/app/staticfiles
    environment:
      - ENVIRONMENT=production
      - DB_NAME=${POSTGRES_DB:-violett_db}
      - DB_USER=${POSTGRES_USER:-violett_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-violett_password}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
    depends_on:
      - db
    restart: always

  proxy:
    image: nginx:alpine
    container_name: violett_nginx_proxy
    ports:
      - "80:80"
      # - "443:443" # For future SSL with Certbot
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landings:/usr/share/nginx/html/landings:ro
      - ./frontend/dist:/usr/share/nginx/html/pilates-frontend:ro
      - django_static_volume:/usr/share/nginx/html/django_static:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data_prod:
  django_static_volume:
